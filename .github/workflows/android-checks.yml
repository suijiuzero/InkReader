name: Android checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INK_EVAL_PARTITION: all
      INK_SOURCE_V2_PARTITION: all
      INK_SOURCE_V3_PARTITION: all
      INK_MODEL_EXPORT: ${{ github.workspace }}/app/build/audit/heading-features.tsv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Verify frozen evaluation inputs
        run: python3 tools/testing/verify_frozen_fixtures.py
      - name: Build, regression and lint
        run: bash gradlew :app:unitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon
      - name: Reproduce our trained heading model
        run: |
          python3 tools/testing/test_heading_model_training.py
          python3 tools/testing/train_heading_model.py app/build/audit/heading-features.tsv --check
      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-check-reports
          path: |
            app/build/reports/
            app/build/audit/heading-model-evaluation.json
          retention-days: 14
